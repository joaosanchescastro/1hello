<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro Clientes</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Cadastro de Clientes</h1>
    <form action="/cadastrar" method="post">
        <label for="CPF">CPF:</label>
        <input type="text" name="CPF" placeholder="CPF" id="c_cpf" required>
        

        <label for="Primeiro Nome">Primeiro Nome:</label>
        <input type="text" name="primeiro_nome"  placeholder="Primeiro Nome" c_primeiro_nome" required>
        
        <label for="Sobrenome">Sobrenome:</label>
        <input type="text" name="sobrenome" placeholder="Sobrenome" id="c_sobrenome" required>
        

        <label for="Idade">Idade:</label>
        <input type="number" name="idade" placeholder="Idade" step="1" id="c_idade" required>
        <button type="submit">Cadastrar</button>

    </form>
</body>
</html>
